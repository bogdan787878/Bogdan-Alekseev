<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grow Food — Богдан Алексеев</title>
  <script>
    const _v = new Date().toISOString().slice(0,13).replace(/[-T:]/g,'');
    ['tokens','base','buttons','tags','cards','layout','effects','responsive'].forEach(function(n) {
      document.write('<link rel="stylesheet" href="../styles/' + n + '.css?v=' + _v + '">');
    });
  </script>
  <link rel="stylesheet" href="case.css">
</head>
<body>
  <svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
    <defs>
      <filter id="grain">
        <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
        <feColorMatrix type="saturate" values="0" in="noise"/>
      </filter>
    </defs>
  </svg>

  <main class="case-main">

    <div class="case-block" style="background: linear-gradient(-109deg, #51CC8A, #0A251E)">
      <div class="case-block-content">

        <div class="case-block-head">
          <h1 class="case-block-title">Grow Food. Редизайн основной воронки для&nbsp;увеличения конверсии в&nbsp;заказ рациона</h1>
        </div>

        <p class="case-block-desc">Переработка ключевого пользовательского пути в&nbsp;приложении доставки еды. Фокус на&nbsp;снижении отказов и&nbsp;росте конверсии в&nbsp;первый заказ.</p>

        <div class="case-block-tags">
          <span class="tag">ecomm</span>
          <span class="tag">mobile</span>
          <span class="tag">B2C</span>
          <span class="tag">2019–2020</span>
          <span class="tag">Product Designer</span>
        </div>

        <img src="../images/growfood-mockup-1.png" alt="Grow Food mockup" class="case-block-mockup">

      </div>
    </div>

  </main>

  <script src="../js/ui.js"></script>

</body>
</html>
