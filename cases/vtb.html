<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ВТБ — Богдан Алексеев</title>
  <script>
    const _v = new Date().toISOString().slice(0,13).replace(/[-T:]/g,'');
    ['tokens','base','buttons','tags','cards','layout','effects','responsive'].forEach(function(n) {
      document.write('<link rel="stylesheet" href="../styles/' + n + '.css?v=' + _v + '">');
    });
  </script>
  <link rel="stylesheet" href="case.css">
</head>
<body>
  <svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
    <defs>
      <filter id="grain">
        <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
        <feColorMatrix type="saturate" values="0" in="noise"/>
      </filter>
    </defs>
  </svg>

  <main class="case-main">

    <div class="case-block" style="background: linear-gradient(-36deg, #2731DA, #050329)">
      <div class="case-block-content">

        <div class="case-block-head">
          <h1 class="case-block-title">ВТБ. Цифровая витрина продуктов в&nbsp;омниканальной платформе T2M в&nbsp;30&nbsp;дней</h1>
        </div>

        <p class="case-block-desc">Запуск цифровой витрины продуктов для&nbsp;крупнейшего госбанка России в&nbsp;рамках омниканальной платформы T2M. От&nbsp;концепции до&nbsp;релиза за&nbsp;30 дней.</p>

        <div class="case-block-tags">
          <span class="tag">web</span>
          <span class="tag">fintech</span>
          <span class="tag">B2B/B2E</span>
          <span class="tag">2020–2026</span>
          <span class="tag">Design Director</span>
        </div>


      </div>
      <img src="../images/vtb-mockup-1.webp" alt="ВТБ mockup" class="case-block-mockup">
    </div>

  </main>

  <script src="../js/ui.js"></script>

</body>
</html>
