<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landa Research — Богдан Алексеев</title>
  <script>
    const _v = new Date().toISOString().slice(0,13).replace(/[-T:]/g,'');
    ['tokens','base','buttons','tags','cards','layout','effects','responsive'].forEach(function(n) {
      document.write('<link rel="stylesheet" href="../styles/' + n + '.css?v=' + _v + '">');
    });
  </script>
  <link rel="stylesheet" href="case.css">
</head>
<body>
  <svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
    <defs>
      <filter id="grain">
        <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
        <feColorMatrix type="saturate" values="0" in="noise"/>
      </filter>
    </defs>
  </svg>

  <main class="case-main">

    <div class="case-block">
      <div class="case-block-content">

        <div class="case-block-head">
          <h1 class="case-block-title">Landa Research. AI&nbsp;сервис для&nbsp;анализа UX&#8209;тестов c&nbsp;точностью&nbsp;94%</h1>
          <div class="case-badge">
            <span class="case-badge-rank">TOP 30</span>
            <span class="case-badge-label">✓ SBER 500</span>
          </div>
        </div>

        <p class="case-block-desc">Внутренний AI&#8209;стартап в&nbsp;топ&#8209;3 банке РФ. С&nbsp;нуля — от&nbsp;идеи до&nbsp;пилотов с&nbsp;ВТБ, Госуслугами, Почтой России и&nbsp;Яндекс Практикумом.</p>

        <div class="case-block-tags">
          <span class="tag">✦ AI</span>
          <span class="tag">SaaS</span>
          <span class="tag">B2B</span>
          <span class="tag">2023–2025</span>
          <span class="tag">Art-Director / Product Owner</span>
        </div>

        <img src="../images/landa-mockup-1.webp" alt="Landa Research mockup" class="case-block-mockup">

      </div>
    </div>

  </main>

  <script src="../js/ui.js"></script>

</body>
</html>
